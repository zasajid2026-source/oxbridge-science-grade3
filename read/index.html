<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World-Wide Science — Grade 3 · Oxbridge MM Series</title>
<meta name="description" content="World-Wide Science — Grade 3 (Oxbridge MM Series). Read the full book free online.">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background:linear-gradient(160deg,#1a2332,#232f45 70%);
    color:#ffffff;
    font-family:"Segoe UI", Arial, sans-serif;
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh; overflow:hidden;
  }
  header { text-align:center; padding:14px 16px 6px; }
  header h1 { font-size:20px; letter-spacing:.5px; }
  header h1 span { color:#c9a227; }
  header p { font-size:12px; color:#aeb8cc; margin-top:4px; }
  #stage { flex:1; width:100%; display:flex; align-items:center; justify-content:center; padding:6px 0; min-height:0; }
  #flipbook { box-shadow:0 18px 60px rgba(0,0,0,.45); }
  #loader {
    position:fixed; inset:0; background:#1a2332; z-index:50;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
  }
  #loader .t { font-size:18px; }
  #loader .barw { width:min(420px,80vw); height:10px; background:#232f45; border-radius:6px; overflow:hidden; }
  #loader .bar { height:100%; width:0%; background:#c9a227; border-radius:6px; transition:width .2s; }
  #loader .pc { font-size:13px; color:#aeb8cc; }
  #controls { display:flex; align-items:center; gap:14px; padding:10px 0 16px; }
  #controls button {
    background:#232f45; color:#fff; border:2px solid #c9a227; border-radius:10px;
    padding:9px 18px; font-size:15px; cursor:pointer; font-weight:600;
  }
  #controls button:hover { background:#c9a227; color:#1a2332; }
  #controls button:disabled { opacity:.35; cursor:default; }
  #controls button:disabled:hover { background:#232f45; color:#fff; }
  #pageno { font-size:14px; color:#d6dce8; min-width:120px; text-align:center; }
  #hint { font-size:11px; color:#8b93a5; padding-bottom:10px; }
  #zoomov{position:fixed;inset:0;background:rgba(26,35,50,.97);z-index:100;display:none;flex-direction:column;}
  #zoombar{display:flex;gap:10px;justify-content:center;align-items:center;padding:12px;flex-wrap:wrap;}
  #zoombar button{background:#232f45;color:#fff;border:2px solid #c9a227;border-radius:10px;padding:8px 16px;font-size:15px;cursor:pointer;}
  #zoombar button:hover{background:#c9a227;color:#1a2332;}
  #zoomstage{flex:1;overflow:hidden;position:relative;touch-action:none;display:flex;align-items:center;justify-content:center;min-height:0;}
  #zoomimg{max-width:96%;max-height:100%;touch-action:none;user-select:none;-webkit-user-drag:none;transform-origin:center center;}
  #zoomhint{text-align:center;font-size:12px;color:#8b93a5;padding:8px 12px 12px;}
</style>
</head>
<body>
<div id="loader">
  <div class="t">📖 Opening <b>World-Wide Science — Grade 3</b>…</div>
  <div class="barw"><div class="bar" id="loadbar"></div></div>
  <div class="pc" id="loadpc">0%</div>
</div>
<header>
  <h1>OXBRIDGE MM SERIES <span>· GRADE 1</span></h1>
  <p>Digital flipbook edition &middot; Zulfiqar Ali Sajid</p>
</header>
<div id="stage"><div id="flipbook"></div></div>
<div id="controls">
  <button id="prev">← Prev</button>
  <div id="pageno">– / –</div>
  <button id="zopen">🔍 Zoom</button>
  <button id="next">Next →</button>
</div>
<div id="hint">Tip: drag a page corner or tap a page side to turn it · tap 🔍 Zoom to magnify the page.</div>
<div id="zoomov">
  <div id="zoombar">
    <button id="zin">＋</button>
    <button id="zout">－</button>
    <button id="zreset">Reset</button>
    <button id="zclose">✕ Close</button>
  </div>
  <div id="zoomstage"><img id="zoomimg" alt="Zoomed book page"></div>
  <div id="zoomhint">Pinch or use ＋/－ to zoom · drag to move · double-tap toggles zoom</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
<script>
(function(){
  var TOTAL = 79, loaded = 0, urls = [], flip = null;
  var bar = document.getElementById('loadbar'),
      pc = document.getElementById('loadpc'),
      pageno = document.getElementById('pageno'),
      prevB = document.getElementById('prev'),
      nextB = document.getElementById('next');
  for (var i = 1; i <= TOTAL; i++) {
    urls.push('pages/page-' + String(i).padStart(3,'0') + '.jpg');
  }
  function updateUI(e){
    var p = e.data + 1;
    pageno.textContent = p + ' / ' + TOTAL;
    prevB.disabled = (e.data <= 0);
    nextB.disabled = (e.data >= TOTAL - 1);
  }
  function initBook(){
    if (typeof St === 'undefined' || !St.PageFlip) {
      document.querySelector('#loader .t').textContent = 'Could not load the page-flip library. Check your connection and reload.';
      return;
    }
    flip = new St.PageFlip(document.getElementById('flipbook'), {
      width: 550, height: 712,
      size: 'stretch',
      minWidth: 300, maxWidth: 1100,
      minHeight: 390, maxHeight: 1425,
      maxShadowOpacity: 0.5,
      showCover: true,
      mobileScrollSupport: true,
      swipeDistance: 25,
      showPageCorners: true,
      disableFlipByClick: false,
      flippingTime: 700
    });
    flip.loadFromImages(urls);
    flip.on('flip', updateUI);
    flip.on('init', function(e){ updateUI({data:0}); });
    prevB.onclick = function(){ flip.flipPrev(); };
    nextB.onclick = function(){ flip.flipNext(); };
    document.addEventListener('keydown', function(ev){
      if (document.getElementById('zoomov').style.display === 'flex') {
        if (ev.key === 'Escape') zClose();
        return;
      }
      if (ev.key === 'ArrowLeft') flip.flipPrev();
      if (ev.key === 'ArrowRight') flip.flipNext();
    });
    document.getElementById('loader').style.display = 'none';
  }
  /* ---------- page zoom lightbox ---------- */
  var zov=document.getElementById('zoomov'),
      zstage=document.getElementById('zoomstage'),
      zimg=document.getElementById('zoomimg'),
      zscale=1, zx=0, zy=0, zdw=0, zdh=0,
      ZMIN=1, ZMAX=4;
  function zApply(){ zimg.style.transform='translate('+zx+'px,'+zy+'px) scale('+zscale+')'; }
  function zClamp(){
    if(!zdw) return;
    var sw=zstage.clientWidth, sh=zstage.clientHeight;
    var mx=Math.max(0,(zdw*zscale-sw)/2), my=Math.max(0,(zdh*zscale-sh)/2);
    zx=Math.min(mx,Math.max(-mx,zx)); zy=Math.min(my,Math.max(-my,zy));
  }
  function zSet(ns,cx,cy){
    ns=Math.min(ZMAX,Math.max(ZMIN,ns));
    if(ns===zscale) return;
    var r=zstage.getBoundingClientRect();
    if(cx===undefined){cx=r.width/2; cy=r.height/2;}
    cx-=r.width/2; cy-=r.height/2;
    var k=ns/zscale;
    zx=zx*k+cx*(1-k); zy=zy*k+cy*(1-k);
    zscale=ns;
    if(zscale===1){zx=0; zy=0;}
    zClamp(); zApply();
  }
  function zOpen(){
    if(!flip) return;
    var i=flip.getCurrentPageIndex();
    zdw=0; zdh=0;
    zimg.onload=function(){ zdw=zimg.clientWidth||0; zdh=zimg.clientHeight||0; zClamp(); zApply(); };
    zimg.src=urls[i]||urls[0];
    zscale=1; zx=0; zy=0; zApply();
    zov.style.display='flex';
  }
  function zClose(){ zov.style.display='none'; zimg.removeAttribute('src'); }
  document.getElementById('zopen').onclick=zOpen;
  document.getElementById('zclose').onclick=zClose;
  document.getElementById('zin').onclick=function(){zSet(zscale*1.4);};
  document.getElementById('zout').onclick=function(){zSet(zscale/1.4);};
  document.getElementById('zreset').onclick=function(){zSet(1);};
  zimg.addEventListener('dblclick',function(){ zSet(zscale>1.2?1:2.5); });
  zstage.addEventListener('wheel',function(e){
    e.preventDefault();
    var r=zstage.getBoundingClientRect();
    zSet(zscale*(e.deltaY<0?1.18:1/1.18), e.clientX-r.left, e.clientY-r.top);
  },{passive:false});
  var zpts=new Map(), zPinch=0;
  zstage.addEventListener('pointerdown',function(e){
    try{zstage.setPointerCapture(e.pointerId);}catch(_){}
    zpts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(zpts.size===2){var p=Array.from(zpts.values()); zPinch=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);}
  });
  zstage.addEventListener('pointermove',function(e){
    if(!zpts.has(e.pointerId)) return;
    var prev=zpts.get(e.pointerId);
    zpts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(zpts.size===1){
      if(zscale>1){ zx+=e.clientX-prev.x; zy+=e.clientY-prev.y; zClamp(); zApply(); }
    }else if(zpts.size===2){
      var p=Array.from(zpts.values());
      var d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
      if(zPinch>0&&d>0){
        var r=zstage.getBoundingClientRect();
        zSet(zscale*(d/zPinch),(p[0].x+p[1].x)/2-r.left,(p[0].y+p[1].y)/2-r.top);
      }
      zPinch=d;
    }
  });
  var zEnd=function(e){ zpts.delete(e.pointerId); zPinch=0; };
  zstage.addEventListener('pointerup',zEnd);
  zstage.addEventListener('pointercancel',zEnd);
  /* ---------- preload all pages ---------- */
  urls.forEach(function(u){
    var im = new Image();
    var done = function(){
      loaded++;
      var pct = Math.round(loaded / TOTAL * 100);
      bar.style.width = pct + '%';
      pc.textContent = pct + '%';
      if (loaded >= TOTAL) initBook();
    };
    im.onload = done; im.onerror = done;
    im.src = u;
  });
})();
</script>
</body>
</html>
